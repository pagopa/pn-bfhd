openapi: 3.0.1
info:
  title: >-
    ${stageVariables.ProjectName}-${stageVariables.MicroServiceUniqueName}-${stageVariables.IntendedUsage}
  version: c+1LsP1d86KJSWuMDzNye5ifTMeudIHCgsBNLgdvaVI=
servers:
  - url: https://${stageVariables.DnsName}/{basePath}
    variables:
      basePath:
        default: /${stageVariables.ServiceApiPath}
    x-amazon-apigateway-endpoint-configuration:
      disableExecuteApiEndpoint: true
paths:
  /logs/v1/notifications/info:
    post:
      tags:
        - logs
      x-api-permissions:
        - log-extract-read
      security:
        - pn-auth-fleet_backofficeAuthorizer: []
      operationId: notificationInfoLogs
      x-pagopa-lambda-name: pn-notificationWrapper
      x-pagopa-lambda-account: core
      description: Download the logs archive containing the full info of a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationInfoRequestDto'
      responses:
        '200':
          description: The operation has been successfully completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseDto'
        '400':
          description: Errors during the request validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Errors during the request elaboration
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-amazon-apigateway-integration:
        uri: >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pn-notificationWrapper/invocations
        httpMethod: POST
        requestParameters:
          integration.request.header.x-pagopa-pn-cx-id: context.authorizer.cx_id
          integration.request.header.x-pagopa-pn-cx-role: context.authorizer.cx_role
          integration.request.header.x-pagopa-pn-uid: context.authorizer.uid
          integration.request.header.x-pagopa-pn-jti: context.authorizer.cx_jti
          integration.request.header.x-pagopa-pn-cx-type: context.authorizer.cx_type
          integration.request.header.x-pagopa-pn-cx-groups: context.authorizer.cx_groups
          integration.request.header.x-pagopa-pn-src-ch-details: context.authorizer.sourceChannelDetails
          integration.request.header.x-pagopa-pn-src-ch: '''BACKOFFICE'''
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        timeoutInMillis: 29000
        type: aws_proxy
      parameters: []
    options:
      operationId: Options for /logs/v1/notifications/info API CORS
      x-amazon-apigateway-integration:
        uri: >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pn-notificationWrapper/invocations
        httpMethod: POST
        requestParameters: {}
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        timeoutInMillis: 29000
        type: aws_proxy
components:
  parameters: {}
  schemas:
    SessionLogsRequestDto:
      type: object
      required:
        - ticketNumber
        - jti
        - dateFrom
        - dateTo
        - deanonimization
      properties:
        ticketNumber:
          type: string
        jti:
          type: string
          pattern: '[\w-]+'
          maxLength: 60
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        deanonimization:
          type: boolean
    PersonPersonIdRequestDto:
      type: object
      required:
        - ticketNumber
        - recipientType
      properties:
        ticketNumber:
          type: string
        piva:
          type: string
          minLength: 11
          maxLength: 11
          pattern: ^([0-9]{11})$
        taxId:
          type: string
          minLength: 16
          maxLength: 16
          pattern: >-
            ^([A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1})$
        recipientType:
          $ref: '#/components/schemas/RecipientTypes'
    PersonTaxIdRequestDto:
      type: object
      required:
        - personId
      properties:
        personId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '[A-Za-z0-9~_-]*'
    NotificationInfoRequestDto:
      type: object
      required:
        - ticketsNumber
        - iuns
      properties:
        ticketsNumber:
          type: array
          items:
            type: string
        iuns:
          type: array
          items:
            type: string
          minLength: 25
          maxLength: 25
    PersonLogsRequestDto:
      type: object
      required:
        - ticketNumber
        - deanonimization
      properties:
        ticketNumber:
          type: string
        deanonimization:
          type: boolean
        taxId:
          type: string
          pattern: >-
            ^([A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1})$
        personId:
          type: string
        iun:
          type: string
          minLength: 25
          maxLength: 25
          pattern: >-
            ([A-Za-z]{4})-([A-Za-z]{4})-([A-Za-z]{4})-([0-9]{6})-([A-Za-z]{1})-([0-9]{1})
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        recipientType:
          $ref: '#/components/schemas/RecipientTypes'
    TraceIdLogsRequestDto:
      type: object
      required:
        - traceId
        - dateFrom
        - dateTo
      properties:
        traceId:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
    GetBasicDataResponseDto:
      type: object
      required:
        - data
        - message
      properties:
        data:
          type: string
        message:
          type: string
    BaseResponseDto:
      title: Success response from the server
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Problem:
      properties:
        type:
          description: URI reference of type definition
          type: string
        status:
          description: >-
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          type: number
          example: 503
          maximum: 600
          minimum: 100
          exclusiveMaximum: true
        title:
          description: >-
            A short, summary of the problem type. Written in english and
            readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        detail:
          description: A human readable explanation of the problem.
          example: Request took too long to complete.
          maxLength: 4096
          pattern: ^.{0,4096}$
          type: string
        traceId:
          description: Internal support identifier associated to error
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        timestamp:
          description: date and time referred to UTC
          example: '2022-07-27T12:22:33.444Z'
          type: string
          format: date-time
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'
      required:
        - status
        - errors
    ProblemError:
      properties:
        code:
          description: Internal code of the error, in human-readable format
          example: >-
            PN_PARAMETER_TOO_LONG | PN_PARAMETER_TOO_SHORT | PN_DUPLICATE_ENTRY
            | etc...
          type: string
        element:
          description: Parameter or request body field name for validation error
          example: body.order.item[2].quantity
          type: string
        detail:
          description: >-
            A human readable explanation specific to this occurrence of the
            problem.
          example: Parameter not valid
          maxLength: 1024
          type: string
      required:
        - code
    PnStatusUpdateEventRequestDto:
      title: Event of inefficiency start or end
      type: object
      required:
        - status
        - timestamp
        - functionality
        - sourceType
      properties:
        status:
          $ref: '#/components/schemas/PnFunctionalityStatus'
        timestamp:
          title: the time when the status has changed
          type: string
          format: date-time
        functionality:
          title: functionality list whose availability status has changed
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PnFunctionality'
        sourceType:
          title: event origin type
          type: string
          enum:
            - OPERATOR
        source:
          title: origin event identifier
          type: string
    PnStatusResponseDto:
      title: PN actual status
      description: >-
        PN functionalities and inefficiencies known list when the request is
        sent
      type: object
      required:
        - functionalities
        - openIncidents
      properties:
        functionalities:
          title: PN functionalities list
          type: array
          items:
            $ref: '#/components/schemas/PnFunctionality'
        openIncidents:
          title: Inefficiencies list
          type: array
          items:
            $ref: '#/components/schemas/PnDowntimeEntry'
    PnDowntimeEntry:
      title: Data related to a PN inefficiency
      type: object
      required:
        - functionality
        - status
        - startDate
      properties:
        functionality:
          $ref: '#/components/schemas/PnFunctionality'
        status:
          $ref: '#/components/schemas/PnFunctionalityStatus'
        startDate:
          title: Inefficiency start date
          type: string
          format: date-time
        endDate:
          title: Inefficiency end date
          description: >-
            if the inefficiency is still active, this field will be absent or
            _null_
          type: string
          format: date-time
    RecipientTypes:
      title: PN recipient types
      type: string
      enum:
        - PF
        - PG
    PnFunctionalityStatus:
      title: PN functionalities' status
      type: string
      enum:
        - KO
        - OK
    PnFunctionality:
      title: PN functionalities
      description: >-
        - __NOTIFICATION_CREATE__: the possibility to create new notifications -
        __NOTIFICATION_VISUALIZATION__: the possibility to visualize the
        notifications and download the legalfacts - __NOTIFICATION_WORKFLOW__:
        the notification process advancement
      type: string
      enum:
        - NOTIFICATION_CREATE
        - NOTIFICATION_VISUALIZATION
        - NOTIFICATION_WORKFLOW
      x-enum-varnames:
        - NOTIFICATION_CREATE
        - NOTIFICATION_VISUALIZATION
        - NOTIFICATION_WORKFLOW
  responses: {}
  securitySchemes:
    pn-auth-fleet_backofficeAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        authorizerUri: >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pn-backofficeAuthorizerLambda/invocations
        authorizerResultTtlInSeconds: 300
        type: token
tags:
  - name: persons
    description: Operations about a person
  - name: logs
    description: Operations about logs and extractions
  - name: status
    description: Operations about application status
  - name: downtime
    description: Operations about PN functionalities monitoring
x-amazon-apigateway-gateway-responses:
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Strict-Transport-Security: '''max-age=31536000; includeSubDomains; preload'''
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Strict-Transport-Security: '''max-age=31536000; includeSubDomains; preload'''
  BAD_REQUEST_PARAMETERS:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Access-Control-Expose-Headers: '''x-amzn-trace-id'''
      gatewayresponse.header.Strict-Transport-Security: '''max-age=31536000; includeSubDomains; preload'''
    responseTemplates:
      application/json: >-
        {"status": 400, "title": "VALIDATION ERROR", "traceId":
        "$context.xrayTraceId", "errors": [ { "code": "PN_INVALID_PARAMETERS",
        "detail": "Validation errors: $context.error.validationErrorString" } ]}
  BAD_REQUEST_BODY:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Access-Control-Expose-Headers: '''x-amzn-trace-id'''
      gatewayresponse.header.Strict-Transport-Security: '''max-age=31536000; includeSubDomains; preload'''
    responseTemplates:
      application/json: >-
        {"status": 400, "title": "VALIDATION ERROR", "traceId":
        "$context.xrayTraceId", "errors": [ { "code": "PN_INVALID_BODY",
        "detail": "Validation errors: $context.error.validationErrorString" } ]}
x-amazon-apigateway-request-validators:
  basic:
    validateRequestBody: true
    validateRequestParameters: true
  params-only:
    validateRequestBody: false
    validateRequestParameters: true
x-amazon-apigateway-request-validator: basic
